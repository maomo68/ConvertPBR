<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>SL MATERIALIZER PBR FULL</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/exporters/GLTFExporter.js"></script>
    <style>
        :root {
            --bg-dark: #0b0e14;
            --panel-bg: #1a1f2b;
            --accent-cyan: #00f2ff;
            --accent-purple: #8b5cf6;
            --text-gray: #94a3b8;
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background-color: var(--bg-dark);
            color: white;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .main-container {
            width: 98%;
            max-width: 1400px;
            display: grid;
            grid-template-columns: 1fr 1fr 340px;
            gap: 20px;
            padding: 20px;
        }

        .header-title {
            grid-column: 1 / -1;
            text-align: center;
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: 2px;
            color: var(--accent-cyan);
            text-shadow: 0 0 15px rgba(0, 242, 255, 0.4);
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .preview-card {
            background: #000;
            border-radius: 12px;
            border: 1px solid #334155;
            position: relative;
            overflow: hidden;
            height: 550px;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.8);
        }

        .preview-label {
            position: absolute;
            top: 12px;
            left: 12px;
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid #334155;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--accent-cyan);
            z-index: 10;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .settings-panel {
            background: var(--panel-bg);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #334155;
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 550px;
            overflow-y: auto;
            box-sizing: border-box;
        }

        h3 { font-size: 0.85rem; color: var(--text-gray); margin: 0; text-transform: uppercase; letter-spacing: 1px; }

        .input-group { display: flex; flex-direction: column; gap: 4px; }
        label { font-size: 0.7rem; color: var(--text-gray); font-weight: 600; text-transform: uppercase; }

        input[type="text"] {
            background: #0f172a;
            border: 1px solid var(--accent-purple);
            border-radius: 6px;
            padding: 8px;
            color: var(--accent-cyan);
            outline: none;
        }

        input[type="range"] {
            width: 100%;
            cursor: pointer;
            accent-color: var(--accent-cyan);
        }

        .val-display { float: right; color: var(--accent-cyan); font-size: 0.75rem; }

        .btn {
            padding: 10px;
            border-radius: 8px;
            font-weight: 800;
            cursor: pointer;
            border: none;
            text-transform: uppercase;
            transition: 0.3s;
            font-size: 0.8rem;
        }

        .btn-load { background: var(--accent-purple); color: white; }
        .btn-export { 
            background: var(--accent-cyan); 
            color: #000; 
            box-shadow: 0 0 20px rgba(0, 242, 255, 0.3);
            margin-top: 5px;
        }
        .btn:hover { transform: scale(1.02); filter: brightness(1.1); }

        .hidden { display: none; }

        .initial-upload {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            width: 80%;
        }
    </style>
</head>
<body>

<div class="main-container">
    <div class="header-title">SL MATERIALIZER PBR FULL</div>

    <!-- Viewport 1: Sfera 3D -->
    <div class="preview-card" id="viewer-container-3d">
        <div class="preview-label">Anteprima 3D (Sfera)</div>
        <div id="upload-prompt" class="initial-upload">
            <button class="btn btn-load" onclick="document.getElementById('file-input').click()">Carica Immagine Base</button>
            <p style="font-size: 0.8rem; color: var(--text-gray); margin-top: 10px;">JPG o PNG (1024x1024 consigliato)</p>
        </div>
        <input type="file" id="file-input" class="hidden" accept="image/*">
    </div>

    <!-- Viewport 2: Piano Tiling (Second Life Style) -->
    <div class="preview-card" id="viewer-container-tiling">
        <div class="preview-label">Test Seamless / Tiling SL</div>
    </div>

    <!-- Pannello Controlli -->
    <div class="settings-panel">
        <h3>Material Settings</h3>
        
        <div class="input-group">
            <label>Material Name</label>
            <input type="text" id="mat-name" value="MyPBRMaterial">
        </div>

        <div class="input-group">
            <label>SL Tiling (Ripetizione) <span class="val-display" id="v-tiling">3x3</span></label>
            <input type="range" id="tiling" min="1" max="10" step="1" value="3">
        </div>

        <div class="input-group">
            <label>Roughness <span class="val-display" id="v-rough">0.50</span></label>
            <input type="range" id="roughness" min="0" max="1" step="0.01" value="0.5">
        </div>

        <div class="input-group">
            <label>Metallic <span class="val-display" id="v-metal">0.00</span></label>
            <input type="range" id="metallic" min="0" max="1" step="0.01" value="0">
        </div>

        <div class="input-group">
            <label>Normal Scale <span class="val-display" id="v-normal">1.0</span></label>
            <input type="range" id="normalScale" min="0" max="3" step="0.1" value="1">
        </div>

        <div class="input-group">
            <label>Emissive Intensity <span class="val-display" id="v-emissive">0.00</span></label>
            <input type="range" id="emissive" min="0" max="1" step="0.05" value="0">
        </div>

        <button class="btn btn-load" onclick="document.getElementById('file-input').click()">Change Image</button>
        <button class="btn btn-export" onclick="exportGLTF()">Export .GLTF Completo SL &rarr;</button>
        
        <p style="font-size: 0.65rem; color: var(--text-gray); text-align: center;">
            Compatibile al 100% con Second Life PBR (gLTF/GLB Standard)<br>Include Base, Normal, (O)RM ed Emissiva
        </p>
    </div>
</div>

<script>
    let scene3D, camera3D, renderer3D, sphere;
    let sceneTile, cameraTile, rendererTile, planeTile;
    let material3D, materialTile;
    
    let baseImg = null;
    let baseCanvas, normCanvas, ormCanvas, emissiveCanvas;

    const fileInput = document.getElementById('file-input');

    fileInput.onchange = (e) => {
        const file = e.target.files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
            baseImg = new Image();
            baseImg.onload = () => {
                initScenes();
                updatePBRTextures();
            };
            baseImg.src = event.target.result;
        };
        reader.readAsDataURL(file);
    };

    function initScenes() {
        document.getElementById('upload-prompt').classList.add('hidden');
        
        // --- 1. Scena Sfera 3D ---
        const container3D = document.getElementById('viewer-container-3d');
        if(renderer3D) container3D.removeChild(renderer3D.domElement);

        scene3D = new THREE.Scene();
        camera3D = new THREE.PerspectiveCamera(45, container3D.clientWidth / 550, 0.1, 100);
        camera3D.position.z = 2.8;

        renderer3D = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer3D.setSize(container3D.clientWidth, 550);
        container3D.appendChild(renderer3D.domElement);

        addLighting(scene3D);

        material3D = new THREE.MeshStandardMaterial({ roughness: 1.0, metalness: 1.0 });
        sphere = new THREE.Mesh(new THREE.SphereGeometry(1, 128, 128), material3D);
        scene3D.add(sphere);

        // --- 2. Scena Piano Tiling ---
        const containerTile = document.getElementById('viewer-container-tiling');
        if(rendererTile) containerTile.removeChild(rendererTile.domElement);

        sceneTile = new THREE.Scene();
        cameraTile = new THREE.PerspectiveCamera(45, containerTile.clientWidth / 550, 0.1, 100);
        cameraTile.position.z = 2.5;

        rendererTile = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        rendererTile.setSize(containerTile.clientWidth, 550);
        containerTile.appendChild(rendererTile.domElement);

        addLighting(sceneTile);

        materialTile = new THREE.MeshStandardMaterial({ roughness: 1.0, metalness: 1.0 });
        planeTile = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), materialTile);
        sceneTile.add(planeTile);

        // --- Bind Eventi Controlli ---
        document.getElementById('tiling').oninput = (e) => {
            const val = parseInt(e.target.value);
            document.getElementById('v-tiling').innerText = `${val}x${val}`;
            updatePBRTextures();
        };
        document.getElementById('roughness').oninput = (e) => {
            document.getElementById('v-rough').innerText = parseFloat(e.target.value).toFixed(2);
            updatePBRTextures();
        };
        document.getElementById('metallic').oninput = (e) => {
            document.getElementById('v-metal').innerText = parseFloat(e.target.value).toFixed(2);
            updatePBRTextures();
        };
        document.getElementById('normalScale').oninput = (e) => {
            const val = parseFloat(e.target.value);
            document.getElementById('v-normal').innerText = val.toFixed(1);
            if(material3D) material3D.normalScale.set(val, val);
            if(materialTile) materialTile.normalScale.set(val, val);
        };
        document.getElementById('emissive').oninput = (e) => {
            document.getElementById('v-emissive').innerText = parseFloat(e.target.value).toFixed(2);
            updatePBRTextures();
        };

        animate();
    }

    function addLighting(targetScene) {
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        targetScene.add(ambientLight);

        const mainLight = new THREE.DirectionalLight(0xffffff, 1.2);
        mainLight.position.set(1, 1, 5);
        targetScene.add(mainLight);

        const backLight = new THREE.PointLight(0xffffff, 0.5);
        backLight.position.set(-5, 2, -5);
        targetScene.add(backLight);
    }

    // --- GENERAZIONE CANVAS (MAPPE) ---
    function generateBaseCanvas(img) {
        const canvas = document.createElement('canvas');
        canvas.width = img.width; canvas.height = img.height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0);
        return canvas;
    }

    function generateNormalMap(img, scale) {
        const canvas = document.createElement('canvas');
        const w = img.width, h = img.height;
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0);

        const imgData = ctx.getImageData(0, 0, w, h);
        const data = imgData.data;
        const normData = ctx.createImageData(w, h);
        const out = normData.data;

        const gray = new Float32Array(w * h);
        for(let i = 0; i < data.length; i += 4) {
            gray[i/4] = (data[i]*0.299 + data[i+1]*0.587 + data[i+2]*0.114) / 255.0;
        }

        for (let y = 0; y < h; y++) {
            for (let x = 0; x < w; x++) {
                let x0 = x > 0 ? x - 1 : x, x1 = x < w - 1 ? x + 1 : x;
                let y0 = y > 0 ? y - 1 : y, y1 = y < h - 1 ? y + 1 : y;

                let dx = (gray[y * w + x1] - gray[y * w + x0]) * scale * 2.0;
                let dy = (gray[y1 * w + x] - gray[y0 * w + x]) * scale * 2.0;
                let dz = 1.0;

                let len = Math.sqrt(dx * dx + dy * dy + dz * dz);
                let nx = (dx / len) * 0.5 + 0.5;
                let ny = (dy / len) * 0.5 + 0.5;
                let nz = (dz / len) * 0.5 + 0.5;

                let idx = (y * w + x) * 4;
                out[idx]     = nx * 255;
                out[idx + 1] = ny * 255;
                out[idx + 2] = nz * 255;
                out[idx + 3] = 255;
            }
        }
        ctx.putImageData(normData, 0, 0);
        return canvas;
    }

    function generateORMMap(w, h, roughVal, metalVal) {
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        const imgData = ctx.createImageData(w, h);
        const data = imgData.data;

        const r = 255; // Ambient Occlusion 100%
        const g = Math.round(roughVal * 255);
        const b = Math.round(metalVal * 255);

        for (let i = 0; i < data.length; i += 4) {
            data[i]     = r;
            data[i + 1] = g;
            data[i + 2] = b;
            data[i + 3] = 255;
        }
        ctx.putImageData(imgData, 0, 0);
        return canvas;
    }

    function generateEmissiveMap(img, emissiveVal) {
        const canvas = document.createElement('canvas');
        const w = img.width, h = img.height;
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0);

        const imgData = ctx.getImageData(0, 0, w, h);
        const data = imgData.data;

        for (let i = 0; i < data.length; i += 4) {
            data[i]     = Math.round(data[i] * emissiveVal);
            data[i + 1] = Math.round(data[i + 1] * emissiveVal);
            data[i + 2] = Math.round(data[i + 2] * emissiveVal);
            data[i + 3] = 255;
        }
        ctx.putImageData(imgData, 0, 0);
        return canvas;
    }

    // --- AGGIORNAMENTO TEXTURES & MATERIALI ---
    function updatePBRTextures() {
        if(!baseImg || !material3D || !materialTile) return;

        const roughVal = parseFloat(document.getElementById('roughness').value);
        const metalVal = parseFloat(document.getElementById('metallic').value);
        const normScale = parseFloat(document.getElementById('normalScale').value);
        const emissiveVal = parseFloat(document.getElementById('emissive').value);
        const tileVal = parseInt(document.getElementById('tiling').value);

        baseCanvas = generateBaseCanvas(baseImg);
        normCanvas = generateNormalMap(baseImg, normScale);
        ormCanvas = generateORMMap(baseImg.width, baseImg.height, roughVal, metalVal);
        emissiveCanvas = generateEmissiveMap(baseImg, emissiveVal);

        // Textures per Sfera 3D (Tiling 1x1)
        const baseTex3D = new THREE.CanvasTexture(baseCanvas);
        const normTex3D = new THREE.CanvasTexture(normCanvas);
        const ormTex3D = new THREE.CanvasTexture(ormCanvas);
        const emissiveTex3D = new THREE.CanvasTexture(emissiveCanvas);

        applyMaterialProps(material3D, baseTex3D, normTex3D, ormTex3D, emissiveTex3D, emissiveVal, 1);

        // Textures per Piano Seamless (Tiling NxN)
        const baseTexTile = new THREE.CanvasTexture(baseCanvas);
        const normTexTile = new THREE.CanvasTexture(normCanvas);
        const ormTexTile = new THREE.CanvasTexture(ormCanvas);
        const emissiveTexTile = new THREE.CanvasTexture(emissiveCanvas);

        applyMaterialProps(materialTile, baseTexTile, normTexTile, ormTexTile, emissiveTexTile, emissiveVal, tileVal);
    }

    function applyMaterialProps(mat, base, norm, orm, emissive, emissiveVal, repeatFactor) {
        [base, norm, orm, emissive].forEach(tex => {
            tex.wrapS = THREE.RepeatWrapping;
            tex.wrapT = THREE.RepeatWrapping;
            tex.repeat.set(repeatFactor, repeatFactor);
        });

        mat.map = base;
        mat.normalMap = norm;
        mat.aoMap = orm;
        mat.roughnessMap = orm;
        mat.metalnessMap = orm;
        mat.emissiveMap = emissive;
        mat.emissive.setHex(0xffffff);
        mat.emissiveIntensity = emissiveVal > 0 ? 1.0 : 0.0;

        mat.roughness = 1.0; 
        mat.metalness = 1.0;
        mat.needsUpdate = true;
    }

    function animate() {
        requestAnimationFrame(animate);
        if(sphere) sphere.rotation.y += 0.003;
        if(renderer3D && scene3D) renderer3D.render(scene3D, camera3D);
        if(rendererTile && sceneTile) rendererTile.render(sceneTile, cameraTile);
    }

    function exportGLTF() {
        if(!sphere) { alert("Carica prima un'immagine!"); return; }
        
        const exporter = new THREE.GLTFExporter();
        const fileName = document.getElementById('mat-name').value || "material_sl";
        
        exporter.parse(sphere, (result) => {
            const blob = new Blob([JSON.stringify(result, null, 2)], { type: 'application/json' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = fileName + ".gltf";
            link.click();
        }, { 
            binary: false,
            embedImages: true
        });
    }
</script>
</body>
</html>
